apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eva

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 65.0.0
    releaseName: monitoring
    namespace: eva
    # valuesFile: values/values-prometheus.yaml

  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 6.6.2
    releaseName: loki
    namespace: eva
    # valuesFile: values/values-loki.yaml

  - name: tempo
    repo: https://grafana.github.io/helm-charts
    version: 1.7.1
    releaseName: tempo
    namespace: eva
    # valuesFile: values/values-tempo.yaml

  - name: grafana
    repo: https://grafana.github.io/helm-charts
    version: 8.3.0
    releaseName: grafana
    namespace: eva
    # valuesFile: values/values-grafana.yaml
